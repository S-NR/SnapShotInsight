<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zero and Span Calibration Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>  
  <div class="overlay">
    
    <div class="header">
      <h1> 📍Zero & Span Calibration Tool </h1>
    </div>

  <caliblabel for="zeroRaw">Zero Raw Value (raw at 0% input):</caliblabel label>
  <input type="number" id="zeroRaw" />

  <caliblabel for="spanRaw">Span Raw Value (raw at 100% input):</caliblabel>
  <input type="number" id="spanRaw" />

  <caliblabel for="spanActual">Span Actual Value (e.g. 100, 500 etc):</caliblabel>
  <input type="number" id="spanActual" />

  <hr>

  <caliblabel for="rawInput">New Raw Input:</caliblabel>
  <input type="number" id="rawInput" />

  <button onclick="calculate()">Calibrate</button>

  <div class="result" id="output"></div>

  <script>
    function calculate() {
      const zeroRaw = parseFloat(document.getElementById("zeroRaw").value);
      const spanRaw = parseFloat(document.getElementById("spanRaw").value);
      const spanActual = parseFloat(document.getElementById("spanActual").value);
      const rawInput = parseFloat(document.getElementById("rawInput").value);

      if (isNaN(zeroRaw) || isNaN(spanRaw) || isNaN(spanActual) || isNaN(rawInput)) {
        document.getElementById("output").innerText = "❗ Please fill in all fields correctly.";
        return;
      }

      const spanRange = spanRaw - zeroRaw;

      if (spanRange === 0) {
        document.getElementById("output").innerText = "❗ Invalid span: Zero and Span raw values cannot be the same.";
        return;
      }

      const calibrated = (rawInput - zeroRaw) * (spanActual / spanRange);

      document.getElementById("output").innerText =
        `✅ Calibrated Value: ${calibrated.toFixed(2)}`;
    }
  </script>

</body>
</html>
