<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1-Point Calibration Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>  
  <div class="overlay">
    
    <div class="header">
      <h1> 📍 1-Point Calibration Calculator </h1>
    </div>

  <caliblabel for="rawRef">Reference Raw Value (Measured):</caliblabel>
  <input type="number" id="rawRef" />

  <caliblabel for="actualRef">Actual Known Value:</caliblabel>
  <input type="number" id="actualRef" />

  <hr>

  <caliblabel for="rawInput">New Raw Input:</caliblabel>
  <input type="number" id="rawInput" />

  <button onclick="calculate()">Calibrate</button>

  <div class="result" id="output"></div>

  <script>
    function calculate() {
      const rawRef = parseFloat(document.getElementById("rawRef").value);
      const actualRef = parseFloat(document.getElementById("actualRef").value);
      const rawInput = parseFloat(document.getElementById("rawInput").value);

      if (isNaN(rawRef) || isNaN(actualRef) || isNaN(rawInput)) {
        document.getElementById("output").innerText = "❗ Please fill in all fields correctly.";
        return;
      }

      const offset = rawRef - actualRef;
      const calibrated = rawInput - offset;

      document.getElementById("output").innerText =
        `✅ Calibrated Value: ${calibrated.toFixed(2)} (Offset = ${offset.toFixed(2)})`;
    }
  </script>

</body>
</html>
