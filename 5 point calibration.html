<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>5-Point Calibration Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>  
  <div class="overlay">
    
    <div class="header">
      <h1> 📍 5-Point Calibration Calculator </h1>
    </div>

  <!-- Calibration Points -->
  <caliblabel for="rawRef">Raw 1: (Measured):</caliblabel>
  <input type="number" id="rawRef" />

  <caliblabel for="actualRef">Actual 1 Known Value:</caliblabel>
  <input type="number" id="actualRef" />

  <caliblabel for="rawRef">Raw 2: (Measured):</caliblabel>
  <input type="number" id="rawRef" />

  <caliblabel for="actualRef">Actual 2 Known Value:</caliblabel>
  <input type="number" id="actualRef" />

  <caliblabel for="rawRef">Raw 3: (Measured):</caliblabel>
  <input type="number" id="rawRef" />

  <caliblabel for="actualRef">Actual 3 Known Value:</caliblabel>
  <input type="number" id="actualRef" />

  <caliblabel for="rawRef">Raw 4: (Measured):</caliblabel>
  <input type="number" id="rawRef" />

  <caliblabel for="actualRef">Actual 4 Known Value:</caliblabel>
  <input type="number" id="actualRef" />

  <caliblabel for="rawRef">Raw 5: (Measured):</caliblabel>
  <input type="number" id="rawRef" />

  <caliblabel for="actualRef">Actual 5 Known Value:</caliblabel>
  <input type="number" id="actualRef" />
    
  <hr>

  <caliblabel for="actualRef">New Raw Input: </caliblabel>
  <input type="number" id="rawInput" />

  <button onclick="calculate()">Calibrate</button>

  <div class="result" id="output"></div>

  <script>
    function calculate() {
      const raws = [
        parseFloat(document.getElementById("raw1").value),
        parseFloat(document.getElementById("raw2").value),
        parseFloat(document.getElementById("raw3").value),
        parseFloat(document.getElementById("raw4").value),
        parseFloat(document.getElementById("raw5").value)
      ];

      const actuals = [
        parseFloat(document.getElementById("actual1").value),
        parseFloat(document.getElementById("actual2").value),
        parseFloat(document.getElementById("actual3").value),
        parseFloat(document.getElementById("actual4").value),
        parseFloat(document.getElementById("actual5").value)
      ];

      const rawInput = parseFloat(document.getElementById("rawInput").value);

      // Check for invalid inputs
      if (raws.some(isNaN) || actuals.some(isNaN) || isNaN(rawInput)) {
        document.getElementById("output").innerText = "❗ Please fill in all fields correctly.";
        return;
      }

      // Sort by raw value (in case user entered unordered)
      const combined = raws.map((r, i) => ({ raw: r, actual: actuals[i] }));
      combined.sort((a, b) => a.raw - b.raw);

      // Find segment to interpolate
      for (let i = 0; i < combined.length - 1; i++) {
        const r1 = combined[i].raw;
        const r2 = combined[i + 1].raw;
        const a1 = combined[i].actual;
        const a2 = combined[i + 1].actual;

        if (rawInput >= r1 && rawInput <= r2) {
          const gain = (a2 - a1) / (r2 - r1);
          const offset = a1 - gain * r1;
          const calibrated = gain * rawInput + offset;

          document.getElementById("output").innerText =
            `✅ Calibrated Value: ${calibrated.toFixed(2)} (Interpolated between Raw${i+1} and Raw${i+2})`;
          return;
        }
      }

      document.getElementById("output").innerText = "⚠️ Raw input is outside calibration range.";
    }
  </script>
  </div>
</body>
</html>
